[package]
name = "cashflow"
version = "1.0.0"
description = "Cashflow — controle de gastos pessoais"
authors = ["Guilherme Augusto Martins de Carvalho"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "cashflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2"
