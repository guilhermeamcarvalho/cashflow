# Ambiente completo local: PostgreSQL + API (Spring Boot) + Web (Nginx).
#   docker compose up --build
#   Web:     http://localhost:3000
#   API:     http://localhost:8080  (Swagger: /swagger-ui.html)
name: cashflow

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cashflow
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: cashflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashflow -d cashflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/cashflow
      DATABASE_USERNAME: cashflow
      DATABASE_PASSWORD: cashflow
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-0123456789}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
