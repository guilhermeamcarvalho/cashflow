# ---------------------------------------------------------------------------
# Configuração base. Todos os valores sensíveis vêm de variáveis de ambiente;
# os defaults abaixo servem apenas para desenvolvimento local.
# ---------------------------------------------------------------------------
spring:
  application:
    name: cashflow-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cashflow}
    username: ${DATABASE_USERNAME:cashflow}
    password: ${DATABASE_PASSWORD:cashflow}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # o schema é responsabilidade do Flyway
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never

app:
  security:
    jwt:
      # Em produção defina JWT_SECRET com pelo menos 32 caracteres aleatórios.
      secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
      issuer: cashflow-api
      expiration: ${JWT_EXPIRATION:PT12H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${API_DOCS_ENABLED:true}
    operations-sorter: method

logging:
  level:
    com.cashflow: INFO
