# Blueprint do Render para a API (https://render.com/docs/blueprint-spec).
# O banco é o PostgreSQL do Supabase; o front-end fica na Vercel.
services:
  - type: web
    name: cashflow-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      # Supabase → Connect → Session pooler (IPv4). Formato JDBC:
      # jdbc:postgresql://aws-0-<região>.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME # ex.: postgres.<project-ref>
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS # ex.: https://cashflow.vercel.app,https://*-seu-time.vercel.app
        sync: false
      - key: API_DOCS_ENABLED
        value: "false"
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
